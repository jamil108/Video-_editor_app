name: video_editor_app
description: Advanced multi-track mobile video editor
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Video playback & editing
  video_player: ^2.8.6
  ffmpeg_kit_flutter_new: ^1.4.0   # run ffmpeg commands (trim, transitions, effects, export)

  # File handling
  file_picker: ^6.2.0
  path_provider: ^2.1.3

  # State management
  provider: ^6.1.2
  uuid: ^4.4.0

  # UI helpers for drag/drop timeline
  reorderables: ^0.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
