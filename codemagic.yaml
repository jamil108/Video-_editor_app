workflows:
  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Set up Android platform files
        script: |
          flutter create --platforms=android .
      - name: Force older AGP version
        script: |
          sed -i '' -E 's/com\.android\.application.*version.*/com.android.application" version "8.1.0" apply false/' android/settings.gradle || \
          sed -i -E 's/com\.android\.application.*version.*/com.android.application" version "8.1.0" apply false/' android/settings.gradle
          cat android/settings.gradle
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
